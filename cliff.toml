# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

# Version bumping during the early (pre-1.0) stage of the project:
# a breaking change does not bump the major version (no jump to 1.0.0).
# `feat` commits (including breaking ones such as `feat!:`) bump the minor
# version; releases without a feature commit bump the patch version.
# When the project stabilizes and breaking changes should bump the major
# version again, set `breaking_always_bump_major` back to `true`
# (git-cliff's default).
[bump]
features_always_bump_minor = true
breaking_always_bump_major = false

[remote.github]
owner = "YewFence"
repo = "pi-grove"

[changelog]
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
# Generated Markdown must already satisfy oxfmt: `-` bullets (not `*`), and a
# blank line between a heading and the list under it. Tera collapses whitespace
# around block tags, so each construct ends with `-%}` and relies on its own
# literal newlines instead of the template's line breaks.
body = """
## What's Changed{% if version %} in {{ version | trim_start_matches(pat="v") }}{% endif %}

{% for commit in commits -%}
- {% if commit.remote.pr_title %}{{ commit.remote.pr_title }}{% else %}{{ commit.message | split(pat="\n") | first | trim }}{% endif %}{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% endif %}
{% endfor -%}
{% if github %}{% set new_contributors = github.contributors | filter(attribute="is_first_time", value=true) %}{% if new_contributors | length != 0 %}
### New Contributors

{% for contributor in new_contributors -%}
- @{{ contributor.username }} made their first contribution{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
{% endfor -%}
{% endif %}{% endif -%}
{% if version and previous.version %}
**Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
{% endif -%}
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/docs/#introduction
footer = """

<!-- generated by git-cliff -->
"""
# An array of regex based postprocessors to modify the changelog.
# Replace the placeholder `<REPO>` with a URL.
postprocessors = []

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" }]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
commit_parsers = [{ message = '^chore\([^)]*\): release ', skip = true }]
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "newest"
