[settings]
lockfile = true
minimum_release_age = "3d"

[tools]
node = "26"
aube = "2"
git-cliff = "2"
"packslip:github.com/YewFence/actions/josh" = { version = "26.8.28", minimum_release_age = "0d" }
pinact = "4"
jactionlint = "2"
"github:suzuki-shunsuke/nllint" = "1"
typos = "1.52.0"
betterleaks = "1"

[env]
PINACT_MIN_AGE = "3"

[tasks."deps:install"]
run = "aube install --frozen-lockfile"

[tasks."deps:check"]
run = "aube install --dry-run"

[tasks."deps:fix"]
run = "aube install --lockfile-only"

[tasks."deps:update"]
run = "aube update"

[tasks.audit]
run = "aube audit"

[tasks.typecheck]
run = "aube -r run --if-present typecheck"

[tasks.lint]
run = "aube exec oxlint"

[tasks."lint:fix"]
run = "aube exec oxlint --fix"

[tasks."fmt:check"]
run = "aube exec oxfmt --check ."

[tasks."fmt:fix"]
run = "aube exec oxfmt ."

[tasks."typos:check"]
run = "typos"

[tasks."typos:fix"]
run = "typos --write-changes"

[tasks."newline:check"]
file = "scripts/newlines.sh"

[tasks."newline:fix"]
file = "scripts/newlines.sh"
env = { NEWLINES_FIX = "1" }

[tasks."leaks:check"]
file = "scripts/check-leaks.sh"

[tasks.test]
run = ["aube -r run --if-present test", "aube exec vitest run"]

[tasks."package:check"]
description = "Pack extensions and load their published entry points"
usage = 'arg "[package]" default="all"'
run = 'node scripts/check-packages.mjs "$usage_package"'

[tasks.check]
run = [
  { tasks = ["deps:check", "newline:check", "typos:check", "fmt:check", "typecheck", "lint", "actions:check"] },
  { task = "leaks:check" },
  { task = "test" },
  { task = "package:check" },
  { task = "docs:build" }
]

[tasks.fix]
run = [
  { task = "deps:fix" },
  { task = "newline:fix" },
  { task = "typos:fix" },
  { task = "fmt:fix" },
  { task = "lint:fix" }
]

[tasks."release:plan"]
description = "Compute one package's version and release notes"
usage = '''
arg "<package>"
flag "--ref <ref>" default="HEAD"
flag "--output <output>" default="-"
'''
run = 'node scripts/release.mjs plan "$usage_package" "$usage_ref" "$usage_output"'

[tasks."release:prepare"]
description = "Apply a release plan to package version, changelog, and lockfile"
usage = 'arg "<plan>"'
run = 'node scripts/release.mjs prepare "$usage_plan"'

[tasks."release:validate"]
description = "Validate the package tag and the prepared release base"
usage = '''
arg "<tag>"
flag "--base <base>" default=""
flag "--head <head>" default="HEAD"
'''
run = 'node scripts/release.mjs validate "$usage_tag" "$usage_base" "$usage_head"'

[tasks."release:notes"]
usage = '''
arg "<tag>"
arg "<output>"
'''
run = 'node scripts/release.mjs notes "$usage_tag" "$usage_output"'

[tasks."release:publish"]
description = "Publish exactly the package and version identified by a tag"
usage = '''
arg "<tag>"
flag "--dry-run"
'''
run = 'node scripts/release.mjs publish "$usage_tag" "$usage_dry_run"'

[tasks."actions:check"]
depends = ["actions:pin-offline:check"]
run = "jactionlint .github/workflows/*.yml"

[tasks."actions:pin-offline:check"]
run = "unset PINACT_MIN_AGE && pinact run --fix=false --no-api"

[tasks."actions:pin:check"]
run = "pinact run --check"

[tasks."actions:update"]
run = "pinact run --update"

[tasks."docs:dev"]
dir = "docs"
run = "aube exec vitepress dev"

[tasks."docs:build"]
dir = "docs"
run = "aube exec vitepress build"

[tasks."schema:generate"]
dir = "packages/cues"
run = "aube exec ts-json-schema-generator --path src/piCues/types.ts --type RawConfig --out config.schema.json"
