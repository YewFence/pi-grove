name: Release

on:
  push:
    tags: ["*-v[0-9]*"]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing package tag to publish or retry"
        required: true
        type: string

permissions:
  contents: read

env:
  MISE_LOCKED: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  resolve:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      package: ${{ steps.release.outputs.package }}
      ready: ${{ steps.release.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          install_args: node aube git-cliff packslip:github.com/YewFence/actions/josh
          add_shims_to_path: true
      - id: release
        run: node .github/scripts/release-event.mjs

  publish:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-${{ needs.resolve.outputs.package }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      MISE_LOCKED: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          add_shims_to_path: true
      - run: mise run deps:install
      - run: mise run check
      - name: Create immutable package tag
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git -c tag.gpgsign=false tag "$RELEASE_TAG" "$RELEASE_COMMIT"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Publish npm package
        run: mise run release:publish "$RELEASE_TAG"
      - name: Publish GitHub release
        run: |
          mise run release:notes "$RELEASE_TAG" "$RUNNER_TEMP/notes.md"
          node .github/scripts/publish-release.mjs
