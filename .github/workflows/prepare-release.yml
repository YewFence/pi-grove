name: Prepare Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: "Package directory slug, or all"
        required: true
        default: all
        type: string

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      MISE_LOCKED: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGE: ${{ inputs.package || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          add_shims_to_path: true
      - run: mise run deps:install
      - name: Prepare independent release PRs
        run: |
          mise run release:plan "$PACKAGE" --output "$RUNNER_TEMP/plans.json"
          node .github/scripts/prepare-all.mjs
