name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "aube-lock.yaml"
      - "aube-workspace.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/package.json"
      - "aube-lock.yaml"
      - "aube-workspace.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MISE_LOCKED: "1"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          add_shims_to_path: true
      - run: mise run deps:install
      - run: mise run audit
